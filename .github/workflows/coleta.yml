# Coleta determinística nos runners do GitHub (rede aberta, sem custo de LLM).
# A triagem/fichamento (prompts/triagem.md) fica com o agente Claude agendado,
# que lê o que este workflow commitou.
name: coleta
on:
  schedule:
    - cron: "17 9 * * *"     # diário 06:17 BRT — notícias
    - cron: "37 10 * * 1"    # segunda — matriz + bibliografia
    - cron: "47 11 8 * *"    # dia 8 — séries (ComexStat já publicou o mês)
  workflow_dispatch:
    inputs:
      modo:
        description: "matriz | diario | semanal | mensal | backfill | backfill-biblio | backfill-dados"
        required: true
        default: diario
permissions:
  contents: write
concurrency: coleta
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # backfill: ~270 chamadas ao ComexStat com pausa
    env:
      ROBO_CONTATO: ${{ secrets.ROBO_CONTATO }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests
      - name: Escolher modo
        id: m
        run: |
          if [ -n "${{ github.event.inputs.modo }}" ]; then m="${{ github.event.inputs.modo }}"
          elif [ "${{ github.event.schedule }}" = "37 10 * * 1" ]; then m=semanal
          elif [ "${{ github.event.schedule }}" = "47 11 8 * *" ]; then m=mensal
          else m=diario; fi
          echo "modo=$m" >> "$GITHUB_OUTPUT"
      - name: Matriz (semanal, ou se não houver)
        if: steps.m.outputs.modo == 'semanal' || steps.m.outputs.modo == 'matriz' || hashFiles('fontes/confirmadas.json') == ''
        run: ./rodar.sh matriz || true
      - name: Coletar
        id: c
        run: ./rodar.sh "${{ steps.m.outputs.modo }}"
        continue-on-error: true
        timeout-minutes: 210   # sobra tempo do job para o commit do que já foi gravado
      - name: Commit
        if: always()
        run: |
          git config user.name "robo-rochas"
          git config user.email "robo-rochas@users.noreply.github.com"
          git add -A fontes noticias biblio dados
          git diff --cached --quiet || git commit -m "coleta ${{ steps.m.outputs.modo }} $(date -u +%F)"
          # outra execução ou um commit manual pode ter chegado antes
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Falhar visivelmente se a coleta degradou
        if: steps.c.outcome == 'failure'
        run: exit 1
